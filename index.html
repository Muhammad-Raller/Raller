<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Raller AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .loading {
      text-align: center;
    }

    .car {
      width: 150px;
      height: 80px;
      background: url('https://copilot.microsoft.com/th/id/BCO.47afa215-0b64-4574-a72e-e4e26902b90a.png') no-repeat center/contain;
      position: relative;
      animation: drift 3s infinite ease-in-out;
    }

    @keyframes drift {
      0%   { transform: translateX(-200px) rotate(-10deg); }
      50%  { transform: translateX(200px) rotate(10deg); }
      100% { transform: translateX(-200px) rotate(-10deg); }
    }

    .smoke {
      width: 20px;
      height: 20px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      position: absolute;
      bottom: -10px;
      left: 50%;
      animation: smoke 1.5s infinite;
    }

    @keyframes smoke {
      0%   { transform: scale(0.5) translateY(0); opacity: 1; }
      100% { transform: scale(2) translateY(-40px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="loading">
    <h1>Raller AI 🚗💨</h1>
    <p>Drifting into action...</p>
    <div class="car">
      <div class="smoke"></div>
    </div>
  </div>
</body>
</html>
