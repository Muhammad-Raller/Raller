<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Raller AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #333;
    }
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: #fff;
      z-index: 9999;
    }
    .spinner {
      border: 6px solid #eee;
      border-top: 6px solid #0078D7;
      border-radius: 50%;
      width: 50px; height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #content {
      width: 100%;
      height: 100%;
      display: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Loading Raller AI...</p>
  </div>

  <!-- Main content -->
  <div id="content">
    <!-- IMPORTANT: Replace with your Jotform Publish → Embed link -->
    <iframe src="https://agent.jotform.com/019e0212adfa738d9684f6767fbe14587551"></iframe>
  </div>

  <script>
    window.onload = function() {
      document.getElementById("loader").style.display = "none";
      document.getElementById("content").style.display = "block";
    };
  </script>
</body>
</html>
