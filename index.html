<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Raller AI</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: url('https://images.unsplash.com/photo-1504215680853-026ed2a45def?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      font-family: Arial, sans-serif;
    }

    /* Car drifting animation */
    .car {
      position: absolute;
      bottom: 100px;
      left: -400px;
      width: 400px;
      height: auto;
      background: url('https://i.ibb.co/7jZpL6r/generic-rally-car.png') center/contain no-repeat;
      animation: driftIn 5s ease-in-out forwards;
    }

    @keyframes driftIn {
      0% { left: -400px; transform: rotate(-10deg); opacity: 1; }
      50% { left: 50%; transform: translateX(-50%) rotate(10deg); opacity: 1; }
      100% { left: 50%; transform: translateX(-50%) rotate(10deg); opacity: 0; }
    }

    /* Jotform embed hidden initially */
    .raller {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 900px;
      opacity: 0;
      transition: opacity 2s ease-in;
    }
  </style>
</head>
<body>
  <!-- Car drifting -->
  <div class="car"></div>

  <!-- Your Jotform AI embed -->
  <iframe class="raller"
    src="https://agent.jotform.com/019e0212adfa738d9684f6767fbe14587551"
    width="100%" height="600" style="border:none;">
  </iframe>

  <script>
    // Show Raller AI after 5s drift + 2s fade
    setTimeout(() => {
      document.querySelector('.raller').style.opacity = 1;
    }, 7000); // 5s drift + 2s fade
  </script>
</body>
</html>
