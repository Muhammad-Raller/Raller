<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Raller AI</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: url('https://images.unsplash.com/photo-1504215680853-026ed2a45def?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      font-family: Arial, sans-serif;
    }

    .car {
      position: absolute;
      bottom: 100px;
      left: -400px;
      width: 400px;
      height: auto;
      background: url('https://copilot.microsoft.com/th/id/BCO.f69ef8e3-62fd-4fa7-b62b-79381b3168ba.png') center/contain no-repeat;
      animation: driftIn 6s ease-in-out forwards;
    }

    @keyframes driftIn {
      0% { left: -400px; transform: rotate(-10deg); opacity: 1; }
      50% { left: 50%; transform: translateX(-50%) rotate(10deg); opacity: 1; }
      100% { left: 50%; transform: translateX(-50%) rotate(10deg); opacity: 0; }
    }

    .raller {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 48px;
      opacity: 0;
      animation: fadeIn 6s ease-in-out 6s forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="car"></div>
  <div class="raller">Raller AI</div>

  <script>
    // End animation after 12 seconds
    setTimeout(() => {
      document.querySelector('.car').style.display = 'none';
    }, 12000);
  </script>
</body>
</html>
