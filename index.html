<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Raller AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      text-align: center;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      background: #0078d7;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #005a9e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Raller 🚀</h1>
    <p>Click below to start the rally car sound!</p>
    <button onclick="startSounds()">Start Engine</button>
  </div>

  <!-- Rally Car + Beep Sounds -->
  <audio id="rallySound" preload="auto">
    <source src="https://actions.google.com/sounds/v1/transportation/car_rev.ogg" type="audio/ogg">
  </audio>

  <audio id="beepSound" preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
  </audio>

  <script>
    function startSounds() {
      const rally = document.getElementById("rallySound");
      const beep = document.getElementById("beepSound");

      rally.play();
      rally.onended = () => {
        beep.play();
      };
    }
  </script>
</body><!-- Rally Car + Beep Sounds -->
<audio id="rallySound" preload="auto">
  <source src="https://actions.google.com/sounds/v1/transportation/car_rev.ogg" type="audio/ogg">
</audio>

<audio id="beepSound" preload="auto">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<button onclick="startSounds()">Start Engine</button>

<script>
  function startSounds() {
    const rally = document.getElementById("rallySound");
    const beep = document.getElementById("beepSound");

    rally.play();
    rally.onended = () => {
      beep.play();
    };
  }
</script>

</html>
