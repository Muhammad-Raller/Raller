<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Raller AI - Your AI Assistant for Students</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0078D7">
  <meta name="description" content="Raller AI - Your intelligent AI assistant designed for students. Get help with problems, find safe information, and learn gaming strategies.">
  
  <!-- Link to the PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #ffffff;
      color: #333;
    }
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(135deg, #0078D7 0%, #00A4EF 100%);
      z-index: 9999;
    }
    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.3);
      border-top: 6px solid #ffffff;
      border-radius: 50%;
      width: 50px; height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #loader p {
      color: white;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    #content {
      width: 100%;
      height: 100%;
      display: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Loading Raller AI...</p>
  </div>

  <!-- Main content -->
  <div id="content">
    <!-- Jotform AI Agent Embed -->
    <iframe src="https://agent.jotform.com/019e0212adfa738d9684f6767fbe14587551"></iframe>
  </div>

  <script>
    // Hide the loading screen and show the content
    window.addEventListener('load', function() {
      document.getElementById("loader").style.display = "none";
      document.getElementById("content").style.display = "block";
    });

    // Register the Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log("✓ Service Worker Registered Successfully!"))
        .catch(err => console.error("✗ Service Worker registration failed:", err));
    }
  </script>
</body>
</html>
